<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>CreativeOS Capture</title>
    <style>
      body { font: 13px/1.45 "Segoe UI", system-ui, sans-serif; color: #242424; width: 320px; margin: 0; padding: 14px 16px 16px; }
      h1 { font-size: 15px; margin: 0 0 2px; }
      p { margin: 0 0 10px; color: #616161; }
      label { display: grid; gap: 4px; margin-bottom: 10px; font-weight: 600; }
      input, select { font: inherit; padding: 6px 8px; border: 1px solid #d1d1d1; border-bottom-color: #616161; border-radius: 4px; }
      button { font: inherit; font-weight: 600; padding: 6px 12px; border-radius: 4px; border: 1px solid #d1d1d1; background: #fff; cursor: pointer; }
      button.primary { background: #0f6cbd; border-color: #0f6cbd; color: #fff; }
      .row { display: flex; gap: 8px; align-items: center; }
      .status { margin-top: 10px; font-size: 12px; }
      .ok { color: #0e700e; }
      .error { color: #b10e1c; }
      .hint { font-weight: 400; color: #707070; font-size: 11px; }
      hr { border: 0; border-top: 1px solid #e0e0e0; margin: 12px 0; }
    </style>
  </head>
  <body>
    <h1>CreativeOS Capture</h1>
    <p>Saves Meta Ad Library ads into a CreativeOS project.</p>

    <label>
      Connection code
      <input id="code" type="password" autocomplete="off" placeholder="cos_…" />
      <span class="hint">From CreativeOS → Settings → Chrome extension.</span>
    </label>
    <details>
      <summary class="hint" style="cursor: pointer; margin-bottom: 8px">Site address</summary>
      <label>
        <input id="site" type="url" />
      </label>
    </details>
    <div class="row">
      <button id="connect" class="primary">Connect</button>
    </div>

    <hr />

    <label>
      Save ads into
      <select id="project" disabled><option>Connect first</option></select>
    </label>
    <label>
      Competitor
      <select id="competitor" disabled><option value="">Match by advertiser name</option></select>
      <span class="hint">Left on “match”, an ad is linked to the tracked competitor with the advertiser's name, if there is one.</span>
    </label>

    <div id="status" class="status"></div>
    <script src="popup.js"></script>
  </body>
</html>
